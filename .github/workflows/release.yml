name: Release VST3

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target ReSIDVST_VST3 resid_smoke plugin_load_smoke --parallel
      - name: Test synth
        run: ./build/Release/resid_smoke.exe
      - name: Test plugin and dropdown ownership
        run: ./build/Release/plugin_load_smoke.exe
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "build/ReSIDVST_artefacts/Release/VST3/reSID VST.vst3" -DestinationPath "reSID-VST-${{ github.ref_name }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: reSID-VST-${{ github.ref_name }}-windows-x64.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --target ReSIDVST_VST3 resid_smoke plugin_load_smoke --parallel
      - name: Test synth
        run: ./build/resid_smoke
      - name: Test plugin
        run: ./build/plugin_load_smoke
      - name: Sign completed bundle
        run: codesign --force --deep --sign - "build/ReSIDVST_artefacts/Release/VST3/reSID VST.vst3"
      - name: Verify signature
        run: codesign --verify --deep --strict "build/ReSIDVST_artefacts/Release/VST3/reSID VST.vst3"
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent "build/ReSIDVST_artefacts/Release/VST3/reSID VST.vst3" "reSID-VST-${{ github.ref_name }}-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: reSID-VST-${{ github.ref_name }}-macos-universal.zip
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-package"
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          reSID-VST-${{ github.ref_name }}-windows-x64.zip
          reSID-VST-${{ github.ref_name }}-macos-universal.zip
          --repo "${{ github.repository }}"
          --title "reSID VST ${{ github.ref_name }}"
          --generate-notes
